[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Run the full artifact build on PRs so we can verify the build without tagging
pr-run-mode = "upload"
# Target platforms to build apps for (Rust target-triple syntax)
# Linux ARM and Windows are excluded: the ffmpeg-sys-next static build is not
# supported for cross-compilation (ARM) and Windows MSVC is too complex in CI.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]

# Build tools required by ffmpeg-sys-next's `build` feature (compiles FFmpeg 7 from source)
[dist.dependencies.apt]
libclang-dev = "*"
nasm = "*"
pkg-config = "*"
protobuf-compiler = "*"

[dist.dependencies.homebrew]
nasm = "*"
protobuf = "*"
