[package]
name = "djicap"
version = "0.1.0"
edition = "2021"
description = "Convert DJI flight logs to Foxglove MCAP files"
keywords = ["dji", "mcap", "foxglove", "drone", "telemetry"]
categories = ["command-line-utilities", "science::robotics"]

[[bin]]
name = "djicap"
path = "src/main.rs"

[dependencies]
dji-log-parser = "0.5.7"
mcap = "0.24.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
dotenvy = "0.15"
ffmpeg-next = { version = "7", optional = true }
ffmpeg-sys-next = { version = "7", optional = true }
chrono = "0.4"

[features]
default = ["video"]
video = ["dep:ffmpeg-next", "dep:ffmpeg-sys-next"]

[dev-dependencies]
tempfile = "3"
