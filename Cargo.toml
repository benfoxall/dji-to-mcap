[package]
name = "dji-to-mcap"
version = "0.1.3"
edition = "2021"
description = "Convert DJI flight logs to Foxglove MCAP files"
repository = "https://github.com/benfoxall/dji-to-mcap"
keywords = ["dji", "mcap", "foxglove", "drone", "telemetry"]
categories = ["command-line-utilities", "science::robotics"]

[[bin]]
name = "dji-to-mcap"
path = "src/main.rs"

[dependencies]
dji-log-parser = "0.5.7"
mcap = "0.24.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
dotenvy = "0.15"
ffmpeg-next = { version = "7", optional = true }
ffmpeg-sys-next = { version = "7", optional = true, features = ["build"] }
chrono = "0.4"
prost = "0.14.3"
prost-types = "0.14.3"

[features]
default = ["video"]
video = ["dep:ffmpeg-next", "dep:ffmpeg-sys-next"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
prost-build = "0.14.3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
